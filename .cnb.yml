# key-agent CNB 配置
# 双产物物理分包构建：Host (Vault内置/Stage物理机) + Guest (Infisical/客卿小鸡)
# 包含：Code Wiki + 飞书通知 + 5架构/双产物构建

$:
  knowledge:update:
    - stages:
        - name: index-repo-knowledge
          ignoreProcessFailures: true
  tag_push:
    - stages:
        - name: build dual-flavor binaries
          image: golang:1.26
          script:
            - export GOPROXY="https://goproxy.cn,direct" CGO_ENABLED=0 GOWORK=off
            - mkdir -p dist
            - go build -trimpath -ldflags '-s -w' -o dist/k-agent-host-linux-amd64 ./cmd/agent_dispatcher
            - go build -trimpath -ldflags '-s -w' -tags guest -o dist/k-agent-guest-linux-amd64 ./cmd/agent_dispatcher
            - ./dist/k-agent-host-linux-amd64 --version || true
            - ./dist/k-agent-guest-linux-amd64 --version || true
            - if strings dist/k-agent-guest-linux-amd64 | grep -qi vault; then echo "❌ guest 纯度失败: 含 vault 字符串"; exit 1; fi
            - echo "✅ guest 二进制零 vault 残留"
            - tar -czf dist/k-agent-host-linux-amd64.tar.gz -C dist k-agent-host-linux-amd64
            - tar -czf dist/k-agent-guest-linux-amd64.tar.gz -C dist k-agent-guest-linux-amd64
        - name: git release
          type: git:release
          options:
            tag: ${CNB_BRANCH}
            description: "KeyAgent Dual-Flavor Release (Host & Guest linux-amd64)"
        - name: upload release attachments
          image: cnbcool/attachments:latest
          settings:
            tag: ${CNB_BRANCH}
            attachments:
              - dist/k-agent-host-linux-amd64.tar.gz
              - dist/k-agent-guest-linux-amd64.tar.gz
    - docker:
        image: cnbcool/codewiki:latest
      stages:
        - name: generate codewiki
          timeout: 10h
          settings:
            git_doc_dir: /data/codewiki/${CNB_REPO_SLUG}
            knowledge_enabled: true
    - stages:
        - name: notify feishu
          image: cnbcool/webhook
          settings:
            urls:
              - https://open.feishu.cn/open-apis/bot/v2/hook/ee30af3c-9ddf-4010-99f5-20dd3ad35f46
            method: POST
            content_type: application/json
            ignoreProcessFailures: true
            template: |
              {
                "msg_type": "interactive",
                "card": {
                  "config": { "wide_screen_mode": true },
                  "header": {
                    "title": { "tag": "plain_text", "content": "key-agent · Tag 触发 Release & Code Wiki" },
                    "template": "green"
                  },
                  "elements": [
                    { "tag": "div", "fields": [
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**事件**\n{{ CNB_EVENT }}" } },
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**触发者**\n{{ CNB_BUILD_USER }}" } },
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**分支/标签**\n{{ CNB_BRANCH }}" } },
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**提交**\n{{ CNB_COMMIT_SHORT }}" } }
                    ]},
                    { "tag": "div", "text": { "tag": "lark_md", "content": "**提交信息**\n{{ CNB_COMMIT_MESSAGE_TITLE }}" } },
                    { "tag": "action", "actions": [
                      { "tag": "button", "text": { "tag": "plain_text", "content": "查看代码" },
                        "url": "{{ CNB_REPO_URL_HTTPS }}/src/tag/{{ CNB_BRANCH }}", "type": "primary" }
                    ]}
                  ]
                }
              }

main:
  push:
    - stages:
        - name: 编译 Host & Guest AMD64 二进制
          image: golang:1.26
          script:
            - export GOPROXY="https://goproxy.cn,direct" CGO_ENABLED=0 GOWORK=off
            - mkdir -p dist
            - go build -trimpath -ldflags '-s -w' -o dist/k-agent-host-linux-amd64 ./cmd/agent_dispatcher
            - go build -trimpath -ldflags '-s -w' -tags guest -o dist/k-agent-guest-linux-amd64 ./cmd/agent_dispatcher
            - ./dist/k-agent-host-linux-amd64 --version || true
            - ./dist/k-agent-guest-linux-amd64 --version || true
            - if strings dist/k-agent-guest-linux-amd64 | grep -qi vault; then echo "❌ guest 纯度失败: 含 vault 字符串"; exit 1; fi
            - echo "✅ guest 二进制零 vault 残留"
            - ls -lh dist/
        - name: notify feishu
          image: cnbcool/webhook
          settings:
            urls:
              - https://open.feishu.cn/open-apis/bot/v2/hook/ee30af3c-9ddf-4010-99f5-20dd3ad35f46
            method: POST
            content_type: application/json
            ignoreProcessFailures: true
            template: |
              {
                "msg_type": "interactive",
                "card": {
                  "config": { "wide_screen_mode": true },
                  "header": {
                    "title": { "tag": "plain_text", "content": "key-agent Dual-Flavor · 代码构建" },
                    "template": "blue"
                  },
                  "elements": [
                    { "tag": "div", "fields": [
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**事件**\n{{ CNB_EVENT }}" } },
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**触发者**\n{{ CNB_BUILD_USER }}" } },
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**分支**\n{{ CNB_BRANCH }}" } },
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**提交**\n{{ CNB_COMMIT_SHORT }}" } }
                    ]},
                    { "tag": "div", "text": { "tag": "lark_md", "content": "**提交信息**\n{{ CNB_COMMIT_MESSAGE_TITLE }}" } },
                    { "tag": "action", "actions": [
                      { "tag": "button", "text": { "tag": "plain_text", "content": "查看构建" },
                        "url": "{{ CNB_BUILD_WEB_URL }}", "type": "primary" }
                    ]}
                  ]
                }
              }
  pull_request:
    - stages:
        - name: notify feishu
          image: cnbcool/webhook
          settings:
            urls:
              - https://open.feishu.cn/open-apis/bot/v2/hook/ee30af3c-9ddf-4010-99f5-20dd3ad35f46
            method: POST
            content_type: application/json
            ignoreProcessFailures: true
            template: |
              {
                "msg_type": "interactive",
                "card": {
                  "config": { "wide_screen_mode": true },
                  "header": {
                    "title": { "tag": "plain_text", "content": "key-agent · PR 更新" },
                    "template": "orange"
                  },
                  "elements": [
                    { "tag": "div", "fields": [
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**事件**\n{{ CNB_EVENT }}" } },
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**PR**\n#{{ CNB_PULL_REQUEST_IID }} {{ CNB_PULL_REQUEST_TITLE }}" } },
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**来源分支**\n{{ CNB_PULL_REQUEST_BRANCH }}" } },
                      { "is_short": true, "text": { "tag": "lark_md", "content": "**提交**\n{{ CNB_COMMIT_SHORT }}" } }
                    ]},
                    { "tag": "div", "text": { "tag": "lark_md", "content": "**最新提交**\n{{ CNB_COMMIT_MESSAGE_TITLE }}" } },
                    { "tag": "action", "actions": [
                      { "tag": "button", "text": { "tag": "plain_text", "content": "查看 PR" },
                        "url": "{{ CNB_REPO_URL_HTTPS }}/pull/{{ CNB_PULL_REQUEST_IID }}", "type": "primary" }
                    ]}
                  ]
                }
              }

# ── 白嫖制度：feature 分支构建（主推 guest，linux/amd64）──
"feature/*":
  push:
    - imports:
        - https://cnb.cool/git4ta/cnbvault/-/blob/main/env.yml
      stages:
        - name: job0 credential probe
          image: bash:latest
          script: |
            set -euo pipefail
            fail=0
            for v in OCA_ENDPOINT OCA_BUCKET OCA_ACCESS_KEY OCA_SECRET_KEY; do
              eval "val=\${$v:-}"
              if [ -z "$val" ]; then
                echo "❌ $v 未注入"
                fail=1
              else
                echo "✅ $v SET=true LEN=${#val}"
              fi
            done
            [ "$fail" -eq 0 ] || { echo "凭据未就绪，终止流水线（检查 cnbvault/env.yml 与 allow_slugs）"; exit 1; }
        - name: job1 build guest linux/amd64
          image: golang:1.26
          script: |
            set -euo pipefail
            go version
            export GOPROXY="https://goproxy.cn,direct" CGO_ENABLED=0 GOWORK=off
            mkdir -p dist
            GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags '-s -w' -tags guest -o dist/k-agent-guest-linux-amd64 ./cmd/agent_dispatcher
            if strings dist/k-agent-guest-linux-amd64 | grep -qi vault; then
              echo "❌ k-agent-guest-linux-amd64 含 vault 字符串，guest 纯度失败"; exit 1
            fi
            echo "✅ k-agent-guest-linux-amd64 无 vault 残留"
            ls -l dist/
            sha256sum dist/k-agent-* | tee dist/SHA256SUMS
        - name: job2 upload to branch archive
          image: minio/mc
          script: |
            set -euo pipefail
            DEST="oca/${OCA_BUCKET}/k-agent/feature/dual-flavor-secrets"
            mc alias set oca "$OCA_ENDPOINT" "$OCA_ACCESS_KEY" "$OCA_SECRET_KEY"
            for f in dist/k-agent-*; do
              [ -f "$f" ] || continue
              mc cp "$f" "${DEST}/"
            done
            mc cp dist/SHA256SUMS "${DEST}/" 2>/dev/null || true
            echo "✅ 已上传到 ${DEST}"
        - name: job3 verify sha256
          image: minio/mc
          script: |
            set -euo pipefail
            DEST="oca/${OCA_BUCKET}/k-agent/feature/dual-flavor-secrets"
            mc alias set oca "$OCA_ENDPOINT" "$OCA_ACCESS_KEY" "$OCA_SECRET_KEY"
            ok=0; bad=0
            for f in dist/k-agent-*; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              l=$(sha256sum "$f"); l=${l%% *}
              r=$(mc cat "${DEST}/${fname}" | sha256sum); r=${r%% *}
              if [ "$l" = "$r" ]; then
                echo "✅ ${fname}: ${l} 一致"; ok=$((ok+1))
              else
                echo "❌ SHA256 MISMATCH ${fname}: local=${l} remote=${r}"; bad=$((bad+1))
              fi
            done
            echo "结果: ${ok} 一致 / ${bad} 不一致"
            [ "$bad" -eq 0 ] || exit 1
