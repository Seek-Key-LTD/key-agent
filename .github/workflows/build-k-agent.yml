name: Build and Publish KeyAgent Binaries (NUC Factory)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build 5-Arch Binaries on NUC & Publish to Gitea Registry
    runs-on: nuc
    steps:
      - name: Checkout code (内网 Gitea clone，避免 github.com 间歇不可达)
        run: |
          git clone --depth 1 --branch main \
            https://oauth2:${{ secrets.KAGENT_PKG_TOKEN }}@gitea.capitaltrain.cn/seekkey/key-agent.git .

      - name: Build and Publish Binaries to Package Registry
        run: |
          echo "=========================================================="
          echo "🚀 [NUC Factory] Using Local Native Go: $(go version)"
          echo "=========================================================="
          VERSION="${GITHUB_REF_NAME:-latest}"
          
          mkdir -p dist
          
          # Build 5 platforms
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/k-agent-linux-amd64 ./cmd/agent_dispatcher
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o dist/k-agent-linux-arm64 ./cmd/agent_dispatcher
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags '-s -w' -o dist/k-agent-linux-armv7 ./cmd/agent_dispatcher
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o dist/k-agent-darwin-arm64 ./cmd/agent_dispatcher
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/k-agent-darwin-amd64 ./cmd/agent_dispatcher
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/k-agent-windows-amd64.exe ./cmd/agent_dispatcher

          # Publish to Gitea Package Registry (generic 包同名禁止覆盖 → 先删旧再传)
          for file in dist/*; do
            filename=$(basename "$file")
            echo "Uploading ${filename} to Gitea Package Registry..."
            for target in "${VERSION}" "latest"; do
              # 删除已存在的同名文件（不存在时 404 忽略）
              curl -sf -X DELETE -H "Authorization: token ${{ secrets.KAGENT_PKG_TOKEN }}"               "https://gitea.capitaltrain.cn/api/packages/seekkey/generic/k-agent/${target}/${filename}" || true
              curl -f -H "Authorization: token ${{ secrets.KAGENT_PKG_TOKEN }}"               --upload-file "$file"               "https://gitea.capitaltrain.cn/api/packages/seekkey/generic/k-agent/${target}/${filename}" || { echo "❌ UPLOAD FAILED: ${filename} → ${target}"; exit 1; }
            done
          done
          echo "✓ Binaries published successfully!"

      - name: Verify Registry Artifacts (SHA256 mismatch → fail)
        run: |
          # 回读 latest 产物，逐文件比对 SHA256——防‘上传了但没生效’的静默失败
          echo "🔍 Verifying registry artifacts (SHA256)..."
          for file in dist/*; do
            filename=$(basename "$file")
            local_sha=$(sha256sum "$file" | awk '{print $1}')
            curl -sfL -H "Authorization: token ${{ secrets.KAGENT_PKG_TOKEN }}" -o "/tmp/verify_${filename}" "https://gitea.capitaltrain.cn/api/packages/seekkey/generic/k-agent/latest/${filename}" || { echo "❌ DOWNLOAD FAILED: ${filename}"; exit 1; }
            remote_sha=$(sha256sum "/tmp/verify_${filename}" | awk '{print $1}')
            if [ "$remote_sha" != "$local_sha" ]; then
              echo "❌ SHA256 MISMATCH: ${filename}"
              echo "   local : $local_sha"
              echo "   remote: $remote_sha"
              exit 1
            fi
            echo "✅ ${filename}: ${local_sha:0:12}… (SHA256 verified)"
          done
          echo "✓ All 5 artifacts verified — registry is consistent with this build."
