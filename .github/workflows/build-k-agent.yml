name: Build and Upload k-agent Binaries

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "feishu/**"
      - "integration/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: nuc

    name: Build Binary
    outputs:
      version: ${{ steps.vars.outputs.version }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: k-agent-linux-amd64
          - goos: linux
            goarch: arm64
            artifact_name: k-agent-linux-arm64
          - goos: linux
            goarch: arm
            goarm: 7
            artifact_name: k-agent-linux-armv7
          - goos: darwin
            goarch: amd64
            artifact_name: k-agent-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact_name: k-agent-darwin-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run Tidy
        run: |
          go mod tidy

      - name: Build Binary with Version Info
        id: vars
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          export COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          export VERSION=$(git describe --tags --always 2>/dev/null || echo "v0.0.0-${COMMIT}")
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          export BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -trimpath -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}" -o ${{ matrix.artifact_name }} ./cmd/agent_dispatcher
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload Artifact (Gitea Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

      - name: Publish to Gitea Package Registry (Generic)
        run: |
          curl -s -X PUT -H "Authorization: token ${{ secrets.GITEA_TOKEN || 'e50429fd6361c82e19a5a5d520d5e319f2b8fe17' }}"             --upload-file ${{ matrix.artifact_name }}             "https://gitea.capitaltrain.cn/api/v1/packages/seekkey/generic/k-agent/${{ env.VERSION }}/${{ matrix.artifact_name }}"
          curl -s -X PUT -H "Authorization: token ${{ secrets.GITEA_TOKEN || 'e50429fd6361c82e19a5a5d520d5e319f2b8fe17' }}"             --upload-file ${{ matrix.artifact_name }}.sha256             "https://gitea.capitaltrain.cn/api/v1/packages/seekkey/generic/k-agent/${{ env.VERSION }}/${{ matrix.artifact_name }}.sha256"

  deploy-srv29062:
    needs: build
    name: Deploy to Germany Node (srv29062)
    runs-on: srv29062

    steps:
      - name: Download & Update Binary on srv29062
        run: |
          echo "[srv29062 Deploy] Pulling latest k-agent-linux-amd64 from Gitea Package Registry..."
          GITEA_TOKEN="${{ secrets.GITEA_TOKEN || 'e50429fd6361c82e19a5a5d520d5e319f2b8fe17' }}"
          VERSION="${{ needs.build.outputs.version }}"
          [ -z "$VERSION" ] && VERSION="v0.0.0-latest"
          PKG_URL="https://gitea.capitaltrain.cn/api/v1/packages/seekkey/generic/k-agent/${VERSION}/k-agent-linux-amd64"
          
          curl -sL -H "Authorization: token ${GITEA_TOKEN}" "${PKG_URL}" -o /tmp/k-agent-linux-amd64
          if [ -s /tmp/k-agent-linux-amd64 ]; then
            chmod +x /tmp/k-agent-linux-amd64
            sudo mv /tmp/k-agent-linux-amd64 /usr/local/bin/agent-dispatcher || mv /tmp/k-agent-linux-amd64 /usr/local/bin/agent-dispatcher
            echo "✓ Successfully installed /usr/local/bin/agent-dispatcher (${VERSION}) on srv29062!"
          else
            echo "❌ Download failed or empty file"
            exit 1
          fi
