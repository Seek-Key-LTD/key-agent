name: Build and Upload k-agent Binaries

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "feishu/**"
      - "integration/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: nuc

    name: Build Binary
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: k-agent-linux-amd64
          - goos: linux
            goarch: arm64
            artifact_name: k-agent-linux-arm64
          - goos: linux
            goarch: arm
            goarm: 7
            artifact_name: k-agent-linux-armv7
          - goos: darwin
            goarch: amd64
            artifact_name: k-agent-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact_name: k-agent-darwin-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run Tidy
        run: |
          go mod tidy

      - name: Build Binary with Version Info
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          export COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          export VERSION=$(git describe --tags --always 2>/dev/null || echo "v0.0.0-${COMMIT}")
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          export BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -trimpath -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}" -o ${{ matrix.artifact_name }} ./cmd/agent_dispatcher
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload Artifact (Gitea Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

      - name: Publish to Gitea Package Registry (Generic)
        run: |
          curl -s -X PUT -H "Authorization: token ${{ secrets.GITEA_TOKEN || 'e50429fd6361c82e19a5a5d520d5e319f2b8fe17' }}"             --upload-file ${{ matrix.artifact_name }}             "https://gitea.capitaltrain.cn/api/v1/packages/seekkey/generic/k-agent/${{ env.VERSION }}/${{ matrix.artifact_name }}"
          curl -s -X PUT -H "Authorization: token ${{ secrets.GITEA_TOKEN || 'e50429fd6361c82e19a5a5d520d5e319f2b8fe17' }}"             --upload-file ${{ matrix.artifact_name }}.sha256             "https://gitea.capitaltrain.cn/api/v1/packages/seekkey/generic/k-agent/${{ env.VERSION }}/${{ matrix.artifact_name }}.sha256"
