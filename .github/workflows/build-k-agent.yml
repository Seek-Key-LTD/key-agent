name: Build and Publish KeyAgent Binaries (NUC Factory)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build 5-Arch Binaries on NUC & Publish to Gitea Registry
    runs-on: nuc
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and Publish Binaries to Package Registry
        run: |
          echo "=========================================================="
          echo "🚀 [NUC Factory] Using Local Native Go: $(go version)"
          echo "=========================================================="
          VERSION="${GITHUB_REF_NAME:-latest}"
          
          mkdir -p dist
          
          # Build 5 platforms
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/k-agent-linux-amd64 ./cmd/agent_dispatcher
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o dist/k-agent-linux-arm64 ./cmd/agent_dispatcher
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags '-s -w' -o dist/k-agent-linux-armv7 ./cmd/agent_dispatcher
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o dist/k-agent-darwin-arm64 ./cmd/agent_dispatcher
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/k-agent-windows-amd64.exe ./cmd/agent_dispatcher

          # Publish to Gitea Package Registry
          for file in dist/*; do
            filename=$(basename "$file")
            echo "Uploading ${filename} to Gitea Package Registry..."
            curl --user "${{ secrets.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}"               --upload-file "$file"               "https://gitea.capitaltrain.cn/api/packages/seekkey/generic/k-agent/${VERSION}/${filename}"
            
            curl --user "${{ secrets.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}"               --upload-file "$file"               "https://gitea.capitaltrain.cn/api/packages/seekkey/generic/k-agent/latest/${filename}"
          done
          echo "✓ Binaries published successfully!"

      - name: Verify Registry Artifacts (fail on mismatch)
        run: |
          # 回读 latest 产物，逐文件比对大小——防‘上传了但没生效’的静默失败
          echo "🔍 Verifying registry artifacts (size check)..."
          for file in dist/*; do
            filename=$(basename "$file")
            local_size=$(stat -c%s "$file")
            remote_size=$(curl -sL -o /tmp/verify_${filename} -w "%{size_download}" -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" "https://gitea.capitaltrain.cn/api/packages/seekkey/generic/k-agent/latest/${filename}")
            if [ "$remote_size" != "$local_size" ]; then
              echo "❌ VERIFY FAILED: ${filename} local=${local_size} remote=${remote_size}"
              exit 1
            fi
            echo "✅ ${filename}: ${local_size} bytes verified (registry latest matches build)"
          done
          echo "✓ All 5 artifacts verified — registry is consistent with this build."
