name: Build and Upload k-agent Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: github.server_url == 'https://github.com'

    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: k-agent-linux-amd64
          - goos: linux
            goarch: arm64
            artifact_name: k-agent-linux-arm64
          - goos: linux
            goarch: arm
            goarm: 7
            artifact_name: k-agent-linux-armv7
          - goos: darwin
            goarch: amd64
            artifact_name: k-agent-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact_name: k-agent-darwin-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run Tidy
        run: |
          go mod tidy

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          export VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0")
          export COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV
          export BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -trimpath -ldflags="-s -w" -o ${{ matrix.artifact_name }} ./examples/oracle-agent

      - name: Upload Artifact (GH Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Upload to CF Worker (高能所 IHEP)
        env:
          OCA_ACCESS_KEY: [redacted]
          OCA_SECRET_KEY: [redacted]
        run: |
          curl -s -X PUT -u "$OCA_ACCESS_KEY:[redacted]
            --data-binary @${{ matrix.artifact_name }} \
            "https://cernet-s3.git4ta.fun/k-agent/${{ env.COMMIT }}/${{ matrix.artifact_name }}"

      - name: Upload to OCA (教育网 S3)
        env:
          OCA_ACCESS_KEY: [redacted]
          OCA_SECRET_KEY: [redacted]
        run: |
          which mc || (curl -sL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc && chmod +x /tmp/mc && sudo mv /tmp/mc /usr/local/bin/mc)
          mc alias set oca https://fgws3-ocloud.ihep.ac.cn "$OCA_ACCESS_KEY" "$OCA_SECRET_KEY" --api s3v4
          mc cp ${{ matrix.artifact_name }} "oca/21579-lhhq-164014/k-agent/${{ matrix.artifact_name }}"