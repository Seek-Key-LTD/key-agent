name: Deploy Edge Nodes (Germany)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy-germany:
    name: Deploy to Germany LXC Node (srv29062 / zhuyu)
    runs-on: srv29062
    steps:
      - name: Fetch Package from Gitea Registry & Restart
        run: |
          echo "[Germany Deploy] Fetching compiled k-agent-linux-amd64..."
          curl -sSL "https://gitea.capitaltrain.cn/api/v1/packages/seekkey/generic/k-agent/latest/k-agent-linux-amd64" -o /usr/local/bin/agent-dispatcher
          chmod +x /usr/local/bin/agent-dispatcher
          pkill -f agent-dispatcher || true
          echo "✓ Germany LXC Node (zhuyu) Deployed Successfully!"
